services:
  - type: web
    name: facturi-curatenie
    runtime: python
    plan: free
    region: frankfurt
    rootDir: cleaning-app
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: POLL_INTERVAL
        value: "60"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
